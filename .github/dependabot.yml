version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Keep the toolchain in lockstep so peer dependency ranges never drift apart.
      tooling:
        patterns:
          - '@eslint/*'
          - 'eslint'
          - 'typescript-eslint'
          - 'prettier'
          - 'vite'
          - 'vitest'
          - '@vitest/*'
          - 'happy-dom'
      three:
        patterns:
          - 'three'
          - '@types/three'
    ignore:
      # typescript-eslint supports TypeScript < 6.1; upgrade together once it does.
      - dependency-name: typescript
        update-types: ['version-update:semver-major', 'version-update:semver-minor']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
